[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-cli"
version = "0.1.0"
description = "Fetch and display a random poem from PoetryDB"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "TopherBot", email = "topherbot@proton.me"}
]
keywords = ["poetry", "cli", "random", "poetrydb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
poetry-cli = "poetry_cli.main:main"

[project.optional-dependencies]
# Development utilities – not installed for end users
dev = [
    "ruff",   # Linting / formatting (optional)
    "pytest",
]
